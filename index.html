<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="theme-color" content="#0070C0">
  <title>DQAP Attendance</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary-blue: #0070C0;
      --dark-blue: #0056a0;
      --light-blue: #e0f2fe;
      --success-green: #059669;
      --dark-green: #047857;
      --light-green: #ecfdf5;
      --white: #ffffff;
      --light-gray: #f8fafc;
      --border-gray: #e2e8f0;
      --text-dark: #1e293b;
      --text-light: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: var(--text-dark); background: var(--light-gray); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    
    .header { 
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
      color: var(--white); 
      padding: max(8px, env(safe-area-inset-top)) 12px 8px; 
      position: sticky; 
      top: 0; 
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 112, 192, 0.15);
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header-info { font-size: 11px; opacity: 0.9; margin-top: 2px; }
    
    .main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; padding-bottom: 60px; }
    
    .view { display: none; }
    .view.active { display: block; }
    
    .selector { 
      width: 100%; 
      padding: 10px 12px; 
      margin-bottom: 10px; 
      background: var(--white);
      border: 1.5px solid var(--light-blue);
      border-radius: 8px; 
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dark);
      transition: all 0.2s;
    }
    .selector:focus { 
      outline: none;
      border-color: var(--primary-blue);
      background: var(--light-blue);
    }
    
    .status-box { 
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
      color: var(--white); 
      padding: 14px; 
      border-radius: 10px; 
      text-align: center; 
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(0, 112, 192, 0.2);
    }
    .status-label { font-size: 10px; opacity: 0.85; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-value { font-size: 22px; font-weight: 700; }
    
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn { 
      padding: 11px 12px; 
      border: none; 
      border-radius: 8px; 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--success-green) 0%, var(--dark-green) 100%);
      color: var(--white); 
      grid-column: 1 / -1;
      box-shadow: 0 3px 8px rgba(5, 150, 105, 0.25);
    }
    .btn-primary:active { 
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(5, 150, 105, 0.3);
    }
    .btn-primary:disabled { 
      background: var(--border-gray);
      color: var(--text-light);
      cursor: not-allowed; 
      opacity: 0.5;
      box-shadow: none;
    }
    
    .btn-secondary { 
      background: var(--light-blue);
      color: var(--primary-blue); 
      border: 1px solid var(--primary-blue);
      font-weight: 600;
    }
    .btn-secondary:active { 
      background: var(--primary-blue);
      color: var(--white);
    }
    
    .timeline { display: flex; flex-direction: column; gap: 6px; }
    .day { 
      display: grid; 
      grid-template-columns: 45px 22px 1fr; 
      gap: 10px; 
      padding: 10px; 
      background: var(--white);
      border-radius: 8px; 
      border-left: 3px solid var(--light-blue);
      align-items: center;
      transition: all 0.2s;
    }
    .day:hover { border-left-color: var(--primary-blue); }
    .day-date { font-size: 11px; font-weight: 600; color: var(--text-light); }
    .badge { 
      width: 22px; 
      height: 22px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 11px; 
      color: var(--white); 
      font-weight: 700; 
      flex-shrink: 0;
    }
    .badge.present { background: linear-gradient(135deg, var(--success-green), var(--dark-green)); }
    .badge.ooo { background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue)); }
    .badge.empty { background: var(--border-gray); }
    .day-info { font-size: 11px; font-weight: 500; }
    
    .admin-item { 
      display: grid; 
      grid-template-columns: 1fr 65px; 
      gap: 12px; 
      padding: 10px; 
      background: var(--white);
      border-radius: 8px; 
      border-left: 3px solid var(--light-blue);
      align-items: center; 
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .admin-item:hover { border-left-color: var(--primary-blue); }
    .admin-name { font-size: 12px; font-weight: 600; }
    .admin-status { font-size: 11px; text-align: right; color: var(--text-light); font-weight: 500; }
    
    .rank-item { 
      display: grid; 
      grid-template-columns: 28px 1fr 40px; 
      gap: 12px; 
      padding: 10px; 
      background: var(--white);
      border-radius: 8px; 
      border-left: 3px solid var(--light-blue);
      align-items: center; 
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .rank-item:hover { border-left-color: var(--primary-blue); }
    .rank-num { font-weight: 700; font-size: 12px; text-align: center; color: var(--primary-blue); }
    .rank-name { font-size: 12px; font-weight: 600; }
    .rank-score { font-size: 12px; font-weight: 700; text-align: right; color: var(--success-green); }
    
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 200; padding: 10px; }
    .modal.active { display: flex; align-items: flex-end; }
    .modal-content { 
      background: var(--white); 
      border-radius: 12px 12px 0 0; 
      padding: 16px; 
      width: 100%; 
      animation: slideUp 0.3s ease-out;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-content h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-dark); }
    
    .radio-group { display: flex; flex-direction: column; gap: 6px; }
    .radio-option { 
      padding: 10px 12px; 
      border: 1.5px solid var(--light-blue);
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      cursor: pointer; 
      font-size: 12px;
      transition: all 0.2s;
      background: var(--white);
    }
    .radio-option:hover { border-color: var(--primary-blue); background: var(--light-blue); }
    .radio-option.selected { 
      background: var(--light-blue);
      border-color: var(--primary-blue);
      color: var(--primary-blue);
      font-weight: 600;
    }
    .radio-option input { margin: 0; accent-color: var(--primary-blue); }
    
    .bottom-nav { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: var(--white); 
      border-top: 1px solid var(--border-gray);
      display: flex; 
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
    }
    .nav-item { 
      flex: 1; 
      padding: 10px; 
      text-align: center; 
      cursor: pointer; 
      border: none; 
      background: var(--white); 
      font-size: 12px; 
      font-weight: 600; 
      color: var(--text-light);
      transition: all 0.2s;
    }
    .nav-item.active { 
      color: var(--primary-blue);
      border-top: 3px solid var(--primary-blue);
    }
    .nav-item:active { background: var(--light-blue); }
    
    .msg { 
      padding: 10px 12px; 
      border-radius: 8px; 
      margin-bottom: 10px; 
      font-size: 11px;
      font-weight: 500;
    }
    .error { 
      background: #fee2e2; 
      color: #991b1b;
      border-left: 3px solid #dc2626;
    }
    .success { 
      background: var(--light-green);
      color: #065f46;
      border-left: 3px solid var(--success-green);
    }
    
    .section-title { 
      font-size: 10px; 
      font-weight: 700; 
      color: var(--text-light);
      margin: 12px 0 8px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">Attendance</div>
  <div class="header-info">DQAP Check-In System</div>
</header>

<main class="main">
  
  <!-- EMPLOYEE VIEW -->
  <div id="employeeView" class="view active">
    <select id="userSelect" class="selector">
      <option value="u001">👤 Updesh</option>
      <option value="u002">👤 Pratim</option>
      <option value="u003">👤 Keshav</option>
      <option value="u004">👤 Jawed</option>
      <option value="u005">👤 Dev</option>
      <option value="u006">👤 Ravi</option>
    </select>
    
    <div id="errorMsg"></div>
    <div id="successMsg"></div>
    
    <div class="status-box">
      <div class="status-label">Today's Status</div>
      <div class="status-value" id="todayStatus">—</div>
    </div>
    
    <div class="btn-group">
      <button class="btn btn-primary" id="checkInBtn" onclick="app.submitCheckIn()" disabled>✓ Check In</button>
      <button class="btn btn-secondary" id="oooBtn" onclick="app.showOOOModal()" disabled>⊙ Mark OOO</button>
    </div>
    
    <div class="section-title">10-Day Timeline</div>
    <div id="empTimeline" class="timeline"></div>
  </div>
  
  <!-- ADMIN VIEW -->
  <div id="adminView" class="view">
    <div class="section-title">Today's Check-Ins</div>
    <div id="teamGrid"></div>
  </div>
  
  <!-- RANKING VIEW -->
  <div id="rankingView" class="view">
    <div class="section-title">Team Rankings</div>
    <div id="rankingsList"></div>
  </div>

</main>

<!-- OOO MODAL -->
<div id="oooModal" class="modal">
  <div class="modal-content">
    <h2>📍 Mark as Out of Office</h2>
    <div class="radio-group">
      <label class="radio-option" onclick="app.selectOOO('wfh')">
        <input type="radio" name="ooo"> 🏠 Working from Home
      </label>
      <label class="radio-option" onclick="app.selectOOO('meeting')">
        <input type="radio" name="ooo"> 🤝 Meeting
      </label>
      <label class="radio-option" onclick="app.selectOOO('travel')">
        <input type="radio" name="ooo"> ✈️ Travel
      </label>
      <label class="radio-option" onclick="app.selectOOO('leave')">
        <input type="radio" name="ooo"> 📅 Leave
      </label>
      <label class="radio-option" onclick="app.selectOOO('training')">
        <input type="radio" name="ooo"> 🏆 Training
      </label>
      <label class="radio-option" onclick="app.selectOOO('other')">
        <input type="radio" name="ooo"> 📝 Other
      </label>
    </div>
    <div class="btn-group" style="margin-top: 12px;">
      <button class="btn btn-primary" onclick="app.submitOOO()">Save</button>
      <button class="btn btn-secondary" onclick="app.closeModal('oooModal')">Cancel</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="app.switchView('employee')">👤 Employee</button>
  <button class="nav-item" onclick="app.switchView('admin')">⚙️ Admin</button>
  <button class="nav-item" onclick="app.switchView('ranking')">🏆 Rank</button>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6T2HkI8bindR0yeTN42rOZ50KUew96hY",
  authDomain: "dqap-attendance.firebaseapp.com",
  projectId: "dqap-attendance",
  storageBucket: "dqap-attendance.firebasestorage.app",
  messagingSenderId: "589211325947",
  appId: "1:589211325947:web:a91305e6fa48abf630275e"
};

let db = null;
let firebaseReady = false;

function initFirebase() {
  if (typeof firebase === 'undefined') {
    setTimeout(initFirebase, 300);
    return;
  }
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();
    firebaseReady = true;
    document.getElementById('checkInBtn').disabled = false;
    document.getElementById('oooBtn').disabled = false;
    app.init();
  } catch (e) {
    setTimeout(initFirebase, 1000);
  }
}

window.addEventListener('load', initFirebase);

const app = {
  currentUser: 'u001',
  currentView: 'employee',
  selectedOOO: null,
  
  employees: {
    'u001': 'Updesh', 'u002': 'Pratim', 'u003': 'Keshav',
    'u004': 'Jawed', 'u005': 'Dev', 'u006': 'Ravi'
  },

  init() {
    document.getElementById('userSelect').addEventListener('change', (e) => {
      this.currentUser = e.target.value;
      this.render();
    });
    this.render();
  },

  switchView(view) {
    this.currentView = view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(view === 'employee' ? 'employeeView' : view === 'admin' ? 'adminView' : 'rankingView').classList.add('active');
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.target.classList.add('active');
    this.render();
  },

  showOOOModal() {
    if (!firebaseReady || !db) {
      showError('Loading...');
      return;
    }
    document.getElementById('oooModal').classList.add('active');
  },

  closeModal(id) {
    document.getElementById(id).classList.remove('active');
  },

  selectOOO(type) {
    this.selectedOOO = type;
    document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
  },

  async submitCheckIn() {
    if (!firebaseReady || !db) {
      showError('Loading...');
      return;
    }
    const now = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    const dateStr = (now.getMonth() + 1).toString().padStart(2, '0') + '-' + now.getDate().toString().padStart(2, '0');

    try {
      await db.collection('attendances').doc(`${this.currentUser}_${dateStr}`).set({
        userId: this.currentUser,
        date: dateStr,
        checkin_time: time,
        status: 'present',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      showSuccess(`✓ Checked in at ${time}`);
      setTimeout(() => this.render(), 500);
    } catch (e) {
      showError('Error: ' + e.message);
    }
  },

  async submitOOO() {
    if (!this.selectedOOO) {
      showError('Select reason');
      return;
    }
    if (!firebaseReady || !db) {
      showError('Loading...');
      return;
    }
    const now = new Date();
    const dateStr = (now.getMonth() + 1).toString().padStart(2, '0') + '-' + now.getDate().toString().padStart(2, '0');
    const labels = { 'wfh': 'WFH', 'meeting': 'Meeting', 'travel': 'Travel', 'leave': 'Leave', 'training': 'Training', 'other': 'Other' };

    try {
      await db.collection('attendances').doc(`${this.currentUser}_${dateStr}`).set({
        userId: this.currentUser,
        date: dateStr,
        status: 'ooo',
        oof_type: this.selectedOOO,
        oof_reason: labels[this.selectedOOO],
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      showSuccess(`✓ Marked as ${labels[this.selectedOOO]}`);
      this.selectedOOO = null;
      this.closeModal('oooModal');
      setTimeout(() => this.render(), 500);
    } catch (e) {
      showError('Error: ' + e.message);
    }
  },

  async getRecord(userId, dateStr) {
    if (!firebaseReady || !db) return null;
    try {
      const doc = await db.collection('attendances').doc(`${userId}_${dateStr}`).get();
      return doc.exists ? doc.data() : null;
    } catch (e) {
      return null;
    }
  },

  async getTodayRecord(userId) {
    const now = new Date();
    const dateStr = (now.getMonth() + 1).toString().padStart(2, '0') + '-' + now.getDate().toString().padStart(2, '0');
    return this.getRecord(userId, dateStr);
  },

  async render() {
    if (this.currentView === 'employee') await this.renderEmployee();
    else if (this.currentView === 'admin') await this.renderAdmin();
    else await this.renderRanking();
  },

  async renderEmployee() {
    const todayRecord = await this.getTodayRecord(this.currentUser);
    if (todayRecord) {
      if (todayRecord.status === 'present') {
        document.getElementById('todayStatus').textContent = `✓ ${todayRecord.checkin_time}`;
      } else {
        document.getElementById('todayStatus').textContent = `📍 ${todayRecord.oof_reason}`;
      }
    } else {
      document.getElementById('todayStatus').textContent = '⏳ Pending';
    }

    let html = '';
    const dates = ['06-10', '06-11', '06-12', '06-13', '06-14', '06-15', '06-16', '06-17', '06-18', '06-19'];
    for (const dateStr of dates) {
      const record = await this.getRecord(this.currentUser, dateStr);
      const [m, d] = dateStr.split('-');
      if (record) {
        const icon = record.status === 'present' ? '✓' : '📍';
        const cls = record.status === 'present' ? 'present' : 'ooo';
        const text = record.checkin_time || record.oof_reason;
        html += `<div class="day"><div class="day-date">Jun ${d}</div><span class="badge ${cls}">${icon}</span><div class="day-info">${text}</div></div>`;
      } else {
        html += `<div class="day"><div class="day-date">Jun ${d}</div><span class="badge empty">—</span><div class="day-info">—</div></div>`;
      }
    }
    document.getElementById('empTimeline').innerHTML = html;
  },

  async renderAdmin() {
    let html = '';
    for (const userId of Object.keys(this.employees)) {
      const record = await this.getTodayRecord(userId);
      let status = '⏳ —';
      if (record) {
        status = record.status === 'present' ? `✓ ${record.checkin_time}` : `📍 ${record.oof_reason}`;
      }
      html += `<div class="admin-item"><div class="admin-name">${this.employees[userId]}</div><div class="admin-status">${status}</div></div>`;
    }
    document.getElementById('teamGrid').innerHTML = html;
  },

  async renderRanking() {
    const scores = [];
    for (const userId of Object.keys(this.employees)) {
      let count = 0;
      const dates = ['06-10', '06-11', '06-12', '06-13', '06-14', '06-15', '06-16', '06-17', '06-18', '06-19'];
      for (const dateStr of dates) {
        const record = await this.getRecord(userId, dateStr);
        if (record && record.status === 'present') count++;
      }
      scores.push({ userId, name: this.employees[userId], score: count * 10 });
    }
    scores.sort((a, b) => b.score - a.score);
    let html = '';
    scores.forEach((item, idx) => {
      const medals = ['🥇', '🥈', '🥉'];
      const medal = idx < 3 ? medals[idx] : '  ';
      html += `<div class="rank-item"><div class="rank-num">${medal}</div><div class="rank-name">${item.name}</div><div class="rank-score">${item.score}%</div></div>`;
    });
    document.getElementById('rankingsList').innerHTML = html;
  }
};

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.innerHTML = `<div class="msg error">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.innerHTML = `<div class="msg success">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 2000);
}
</script>

</body>
</html>
